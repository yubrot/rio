[tools]
rust = { version = "1.99.1", components = "clippy,rustfmt", targets = "x86_64-pc-windows-msvc,x86_64-apple-darwin,aarch64-apple-darwin" }
"github:rust-cross/cargo-xwin" = { version = "0.23.1", os = ["linux"] }

# Rio for Windows is built from WSL: `cargo xwin` links it against Microsoft's C runtime and
# Windows SDK (downloaded once into ~/.cache/cargo-xwin), and WSL's interop runs the `.exe`.
# The build script embeds the exe icon only on a Windows host, so this build has none.

[tasks."build:windows"]
description = "Build Rio for Windows (target/x86_64-pc-windows-msvc/release/rio.exe)"
run = "cargo xwin build --release -p rioterm --target x86_64-pc-windows-msvc"

# The modern ConPTY Rio's releases ship beside rio.exe (misc/windows/conhost/README.md), laid out
# next to the built exes (release and fast profiles). fetch.ps1 needs PowerShell 7, so this downloads the same package pinned
# by the same version and SHA-256, without its Authenticode check.
[tasks."build:conpty"]
description = "Lay out conpty.dll and OpenConsole.exe beside the Windows builds"
dir = "{{config_root}}"
run = """
set -eu
script=misc/windows/conhost/fetch.ps1
version=$(sed -n 's/.*\\[string\\]\\$Version = "\\(.*\\)".*/\\1/p' "$script")
sha256=$(sed -n 's/.*\\[string\\]\\$Sha256 = "\\(.*\\)".*/\\1/p' "$script")
work=target/conpty/$version
if [ ! -d "$work/x" ]; then
  mkdir -p "$work"
  curl -fsSL -o "$work/conpty.nupkg" "https://api.nuget.org/v3-flatcontainer/microsoft.windows.console.conpty/$version/microsoft.windows.console.conpty.$version.nupkg"
  echo "$sha256  $work/conpty.nupkg" | sha256sum -c -
  python3 -m zipfile -e "$work/conpty.nupkg" "$work/x"
fi
for out in target/x86_64-pc-windows-msvc/release target/x86_64-pc-windows-msvc/fast; do
  mkdir -p "$out/x64" "$out/arm64"
  cp "$work/x/runtimes/win-x64/native/conpty.dll" "$out/"
  cp "$work/x/build/native/runtimes/x64/OpenConsole.exe" "$out/x64/"
  cp "$work/x/build/native/runtimes/arm64/OpenConsole.exe" "$out/arm64/"
done
"""

# The fast profile (Cargo.toml) rebuilds in seconds, unlike the release profile's LTO.
[tasks."dev:windows"]
description = "Build Rio for Windows in the fast profile and launch it detached"
depends = ["build:conpty"]
run = """
set -eu
cargo xwin build --profile fast -p rioterm --target x86_64-pc-windows-msvc
setsid -f target/x86_64-pc-windows-msvc/fast/rio.exe </dev/null >/dev/null 2>&1
"""

# Copied out of WSL so the installed Rio runs independently of target/ (and rebuilds don't hit a locked exe).
[tasks."install:windows"]
description = "Build Rio for Windows and install it into %LOCALAPPDATA%\\Programs\\Rio"
depends = ["build:windows", "build:conpty"]
run = """
set -eu
dest="$(wslpath "$(cmd.exe /c 'echo %LOCALAPPDATA%' 2>/dev/null | tr -d '\\r')")/Programs/Rio"
src=target/x86_64-pc-windows-msvc/release
mkdir -p "$dest/x64" "$dest/arm64"
# A running exe or dll can't be overwritten but can be renamed, so move it aside;
# leftovers from earlier installs are removed unless still in use.
stamp=$(date +%s)
for f in rio.exe conpty.dll x64/OpenConsole.exe arm64/OpenConsole.exe; do
  for old in "$dest/$f".*.old; do [ -e "$old" ] && rm -f "$old" 2>/dev/null || true; done
  [ -e "$dest/$f" ] && mv "$dest/$f" "$dest/$f.$stamp.old"
  cp "$src/$f" "$dest/$f"
done
echo "Installed into $dest (running instances keep the old binary until restarted)"
"""

# Dev profile: incremental and without the release profile's LTO, so a rebuild takes seconds.
# cargo-xwin defaults the runner to wine; WSL's interop runs the test `.exe` directly instead.
[tasks."test:windows"]
description = "Run rioterm's tests for the Windows target"
env = { CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUNNER = "env" }
run = "cargo xwin test -p rioterm --target x86_64-pc-windows-msvc"

[tasks."check:windows"]
description = "Lint the Windows build (warnings fail)"
run = "cargo xwin clippy --release -p rioterm --target x86_64-pc-windows-msvc -- -D warnings"

# Rio for macOS is built on a Mac, delegating to upstream's Makefile (a universal Rio.app).

[tasks."build:macos"]
description = "Build Rio for macOS (target/release/osx/Rio.app)"
run = "make app-universal"

[tasks."dev:macos"]
description = "Build Rio for macOS in the fast profile and run it"
run = "cargo run --profile fast -p rioterm"

[tasks."test:macos"]
description = "Run rioterm's tests"
run = "cargo test -p rioterm"

[tasks."install:macos"]
description = "Build Rio for macOS, ad-hoc sign it and install it into /Applications"
run = "make install-macos"

[tasks."check:macos"]
description = "Lint the macOS build (warnings fail)"
run = "cargo clippy --release -p rioterm -- -D warnings"
